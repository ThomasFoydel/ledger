name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Ledger.sln

      - name: Build
        run: dotnet build Ledger.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Ledger.sln --configuration Release --no-build
